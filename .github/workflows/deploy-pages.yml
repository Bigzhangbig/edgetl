name: Deploy to Cloudflare Workers

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - { account_id_secret: CF_ID_OUTLOOK, api_token_secret: CF_TOKEN_OUTLOOK }
          - { account_id_secret: CF_ID_BIT,     api_token_secret: CF_TOKEN_BIT }
          - { account_id_secret: CF_ID_GMAIL,   api_token_secret: CF_TOKEN_GMAIL }
          - { account_id_secret: CF_ID_QQ,      api_token_secret: CF_TOKEN_QQ }
          - { account_id_secret: CF_ID_QQ2,     api_token_secret: CF_TOKEN_QQ2 }
    steps:
      - uses: actions/checkout@v6

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets[matrix.target.api_token_secret] }}
          accountId: ${{ secrets[matrix.target.account_id_secret] }}
          command: deploy
