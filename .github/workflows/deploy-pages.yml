name: Deploy to Cloudflare Pages

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - { account_id: CF_ID_QQ,      token: CF_TOKEN_QQ,      project: p4zb0i0r4xk }
          - { account_id: CF_ID_GMAIL,   token: CF_TOKEN_GMAIL,   project: 0883tjvnuvz }
          - { account_id: CF_ID_QQ2,     token: CF_TOKEN_QQ2,     project: p4zb0i0r4xk }
          - { account_id: CF_ID_OUTLOOK,  token: CF_TOKEN_OUTLOOK,  project: 2sr79gbud7n }
          - { account_id: CF_ID_BIT,     token: CF_TOKEN_BIT,     project: p8k3xm7wq2v }
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install wrangler
        run: npm i -g wrangler@4

      - name: Deploy to Cloudflare Pages
        run: |
          mkdir -p /tmp/edgetl-deploy
          cp _worker.js /tmp/edgetl-deploy/
          cp img.png /tmp/edgetl-deploy/
          cd /tmp/edgetl-deploy
          CLOUDFLARE_API_TOKEN=${{ secrets[matrix.target.token] }} \
          CLOUDFLARE_ACCOUNT_ID=${{ secrets[matrix.target.account_id] }} \
          wrangler pages deploy . --project-name=${{ matrix.target.project }}

  dns:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Configure DNS records
        env:
          CF_API_TOKEN: ${{ secrets.CF_TOKEN_OUTLOOK }}
          ZONE_ID: 7d0b4506692963308b3ae0aa4bef0b5c
        run: |
          declare -A DOMAINS=(
            ["edt"]="p8k3xm7wq2v.pages.dev"
            ["edt-2"]="0883tjvnuvz.pages.dev"
            ["edt-3"]="p4zb0i0r4xk.pages.dev"
            ["edt-4"]="2sr79gbud7n.pages.dev"
            ["edt-5"]="p8k3xm7wq2v.pages.dev"
          )
          for name in "${!DOMAINS[@]}"; do
            target="${DOMAINS[$name]}"
            fqdn="${name}.harvryhome.site"
            echo "--- ${fqdn} → ${target} ---"
            existing=$(curl -s "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records?name=${fqdn}&type=CNAME" \
              -H "Authorization: Bearer ${CF_API_TOKEN}" \
              -H "Content-Type: application/json")
            count=$(echo "${existing}" | jq '.result | length')
            if [ "${count}" = "0" ]; then
              result=$(curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records" \
                -H "Authorization: Bearer ${CF_API_TOKEN}" \
                -H "Content-Type: application/json" \
                -d "{\"type\":\"CNAME\",\"name\":\"${fqdn}\",\"content\":\"${target}\",\"proxied\":true}")
              echo "${result}" | jq '{success, errors}'
            else
              echo "Record already exists, skipping"
            fi
          done
