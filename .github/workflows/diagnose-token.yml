name: Diagnose CF Token
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check QQ token permissions
        run: |
          echo "=== Verify CF_TOKEN_QQ ==="
          curl -s "https://api.cloudflare.com/client/v4/user/tokens/verify" \
            -H "Authorization: Bearer ${{ secrets.CF_TOKEN_QQ }}" | jq '.'
          echo ""
          echo "=== List QQ account Pages projects ==="
          curl -s "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CF_ID_QQ }}/pages/projects" \
            -H "Authorization: Bearer ${{ secrets.CF_TOKEN_QQ }}" | jq '{success, errors, result_count: (.result | length), projects: [.result[]? | {name, subdomain}]}'
